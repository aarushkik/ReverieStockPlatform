        const { useState, useEffect, useMemo, useRef, useContext, createContext } = React;

        // === STOCKS & SECTOR LISTS DEFINITIONS ===

            "Technology", "Financials", "Healthcare", "Consumer Cyclical",

        // Seeded random helpers
        function getSeed(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return Math.abs(hash);
        }

        function createRandom(seed) {
            let s = seed;
            return function() {
                const x = Math.sin(s++) * 10000;
                return x - Math.floor(x);
            };
        }

        function generateQuote(meta, offset = 0) {
            const seed = getSeed(meta.symbol);
            const rand = createRandom(seed);
            const basePrice = 25 + rand() * 220;
            const baseChangePct = (rand() - 0.48) * 4.5;
            const prevClose = basePrice / (1 + baseChangePct / 100);
            const price = Math.max(1.0, basePrice + offset);
            const changeVal = price - prevClose;
            const changePct = (changeVal / prevClose) * 100;
            return {
                symbol: meta.symbol,
                name: meta.name,
                sector: meta.sector,
                industry: meta.industry,
                cap: meta.cap,
                country: meta.country,
                exchange: meta.exchange,
                price: price,
                prevClose: prevClose,
                open: prevClose * (1 + (rand() - 0.5) * 0.01),
                changeVal: changeVal,
                changePct: changePct,
                high: Math.max(price, prevClose) * (1 + rand() * 0.01),
                low: Math.min(price, prevClose) * (1 - rand() * 0.01),
                volume: Math.floor(1000000 + rand() * 45000000),
                pe: Math.floor(12 + rand() * 38),
                eps: (1.5 + rand() * 6).toFixed(2),
                targetEst: (price * (1.05 + rand() * 0.15)).toFixed(2),
                marketCap: meta.cap === "Mega" ? "$1.8T" : meta.cap === "Large" ? "$65B" : "$4.8B"
            };
        }

        function generateNews(tag, count) {
            const sources = ["Bloomberg", "CNBC", "Reuters", "Financial Times", "Wall Street Journal"];
            const headlines = [
                "Index rates stabilize as consensus projections shift",
                "Technology indicators hit record high on robust cloud output",
                "Semiconductor industry forecast flags supply rebalances",
                "Global logistical constraints nudge commodity prices upward",
                "Consumer index reports beat retail margin expectations",
                "Earnings revisions spark massive institutional volume influx",
                "Software infrastructure growth beats historic boundaries",
                "Fed meeting minutes project steady rates target path"
            ];
            const news = [];
            for (let i = 0; i < count; i++) {
                const src = sources[i % sources.length];
                const head = headlines[(i * 3) % headlines.length];
                news.push({
                    id: `n_${i}_${Date.now()}`,
                    source: src,
                    timeAgo: `${i * 4 + 5}m ago`,
                    headline: head,
                    sentiment: i % 3 === 0 ? "BULLISH" : i % 3 === 1 ? "NEUTRAL" : "BEARISH",
                    imageSeed: i * 17
                });
            }
            return news;
        }

        function generateOptionsChain(symbol, spotPrice) {
            const strikeCenter = Math.round(spotPrice / 5) * 5;
            const chain = [];
            for (let i = -6; i <= 6; i++) {
                const strike = strikeCenter + i * 5;
                if (strike <= 0) continue;
                const diff = strike - spotPrice;
                const callValue = Math.max(0.15, 6 - diff * 0.7 + (Math.random() - 0.5));
                chain.push({
                    strike: strike,
                    last: callValue.toFixed(2),
                    bid: (callValue * 0.94).toFixed(2),
                    ask: (callValue * 1.06).toFixed(2),
                    oi: Math.floor(150 + Math.random() * 6000)
                });
            }
            return chain;
        }

        function divideRect(x, y, w, h, items) {
            if (items.length === 0) return [];
            const totalWeight = items.reduce((acc, it) => acc + (it.weight || 100), 0);
            let curX = x;
            let curY = y;
            const rects = [];
            const isHorizontal = w >= h;
            
            items.forEach(it => {
                const itemPct = (it.weight || 100) / totalWeight;
                if (isHorizontal) {
                    const itemW = w * itemPct;
                    rects.push({
                        symbol: it.symbol,
                        changePct: it.changePct,
                        x: curX,
                        y: curY,
                        w: itemW,
                        h: h
                    });
                    curX += itemW;
                } else {
                    const itemH = h * itemPct;
                    rects.push({
                        symbol: it.symbol,
                        changePct: it.changePct,
                        x: curX,
                        y: curY,
                        w: w,
                        h: itemH
                    });
                    curY += itemH;
                }
            });
            return rects;
        }

        function generateOrderBook(price, rowsCount = 8, offset = 0) {
            const bids = [];
            const asks = [];
            for (let i = 0; i < rowsCount; i++) {
                const bidPrice = price - 0.05 * (i + 1) + offset * 0.01;
                const askPrice = price + 0.05 * (i + 1) + offset * 0.01;
                bids.push({ price: bidPrice, size: Math.floor(15 + Math.random() * 250) });
                asks.push({ price: askPrice, size: Math.floor(15 + Math.random() * 250) });
            }
            return { bids, asks };
        }

        function CandlestickChart({ symbol, timeframe, overlays = [], livePrice }) {
            const seed = getSeed(symbol);
            const rand = createRandom(seed);
            
            const dataPoints = useMemo(() => {
                const list = [];
                let prevClose = 80 + rand() * 120;
                for (let i = 0; i < 28; i++) {
                    const change = (rand() - 0.47) * 3.5;
                    const open = prevClose;
                    const close = prevClose + change;
                    const high = Math.max(open, close) + rand() * 1.5;
                    const low = Math.min(open, close) - rand() * 1.5;
                    list.push({ open, close, high, low, time: i });
                    prevClose = close;
                }
                return list;
            }, [symbol]);

            const activeData = useMemo(() => {
                if (dataPoints.length === 0) return [];
                const copy = [...dataPoints];
                const last = { ...copy[copy.length - 1] };
                last.close = livePrice;
                last.high = Math.max(last.high, livePrice);
                last.low = Math.min(last.low, livePrice);
                copy[copy.length - 1] = last;
                return copy;
            }, [dataPoints, livePrice]);

            const minPrice = Math.min(...activeData.map(d => d.low)) * 0.995;
            const maxPrice = Math.max(...activeData.map(d => d.high)) * 1.005;
            const priceRange = maxPrice - minPrice || 1;

            const width = 600;
            const height = 220;
            const plotHeight = height - 25;
            const candleWidth = 14;
            const candleGap = 6;

            const getX = (index) => 40 + index * (candleWidth + candleGap);
            const getY = (price) => plotHeight - ((price - minPrice) / priceRange) * (plotHeight - 15);

            return (
                <div class="w-full h-full relative">
                    <svg class="w-full h-full" viewBox={`0 0 ${width} ${height}`}>
                        {[0.2, 0.5, 0.8].map((ratio, idx) => {
                            const gridY = 15 + ratio * (plotHeight - 15);
                            const priceVal = maxPrice - ratio * priceRange;
                            return (
                                <g key={idx}>
                                    <line x1="40" y1={gridY} x2={width - 55} y2={gridY} stroke="#1E2433" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
                                    <text x={width - 50} y={gridY + 3} fill="#8A94A6" font-size="9" font-family="JetBrains Mono" class="tabular-nums">${priceVal.toFixed(2)}</text>
                                </g>
                            );
                        })}

                        {activeData.map((d, i) => {
                            const x = getX(i);
                            const yOpen = getY(d.open);
                            const yClose = getY(d.close);
                            const yHigh = getY(d.high);
                            const yLow = getY(d.low);
                            const isUp = d.close >= d.open;
                            
                            const top = Math.min(yOpen, yClose);
                            const bottom = Math.max(yOpen, yClose);
                            const candleH = Math.max(2, bottom - top);

                            return (
                                <g key={i}>
                                    <line x1={x + candleWidth / 2} y1={yHigh} x2={x + candleWidth / 2} y2={yLow} stroke={isUp ? "#00C805" : "#FF3B30"} stroke-width="1.5" />
                                    <rect x={x} y={top} width={candleWidth} height={candleH} fill={isUp ? "#00C805" : "#FF3B30"} rx="1.5" />
                                </g>
                            );
                        })}

                        {overlays.includes("MA") && (
                            <polyline 
                                fill="none" 
                                stroke="#58A6FF" 
                                stroke-width="1.8" 
                                points={activeData.map((d, i) => `${getX(i) + candleWidth / 2},${getY(d.close)}`).join(" ")}
                            />
                        )}
                    </svg>
                </div>
            );
        }

        // Helper to convert arrays to CSV and trigger download
        function exportCSV(filename, headers, rows) {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += headers.join(",") + "\r\n";
            rows.forEach(r => {
                csvContent += r.map(val => `"${val}"`).join(",") + "\r\n";

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");

            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();

            const addToWatchlist = (sym) => {

                    if (!list.includes(sym)) {
                        return { ...prev, [activeWatchlistName]: [...list, sym] };
                    }

                });
            };

            const removeFromWatchlist = (sym) => {
                setNamedWatchlists(prev => {
                    const list = prev[activeWatchlistName] || [];
                    return { ...prev, [activeWatchlistName]: list.filter(x => x !== sym) };
                });
            };

            const placeOrder = ({ symbol, side, type, qty, price }) => {
                const executionPrice = parseFloat(price);
                const totalCost = executionPrice * qty;

                if (side === "BUY") {
                    if (totalCost > cash) return { success: false, error: "Insufficient Cash Balance" };
                    setCash(prev => prev - totalCost);
                    setPositions(prev => {
                        const existing = prev[symbol];
                        if (existing) {
                            const newQty = existing.qty + qty;
                            const newCost = (existing.qty * existing.avgCost + totalCost) / newQty;
                            return { ...prev, [symbol]: { qty: newQty, avgCost: newCost } };
                        } else {
                            return { ...prev, [symbol]: { qty, avgCost: executionPrice } };
                        }
                    });
                } else {
                    const pos = positions[symbol];
                    if (!pos || pos.qty < qty) return { success: false, error: "Insufficient Position size" };
                    setCash(prev => prev + totalCost);
                    setPositions(prev => {
                        const next = { ...prev };
                        const nextQty = pos.qty - qty;
                        if (nextQty === 0) delete next[symbol];
                        else next[symbol] = { ...pos, qty: nextQty };
                        return next;
                    });
                }

                const dateStr = new Date().toISOString().slice(0, 16).replace("T", " ");
                const newOrder = {
                    id: "o_" + Math.floor(1000 + Math.random() * 9000),
                    symbol,
                    side,
                    type,
                    qty,
                    price: executionPrice,
                    date: dateStr,
                    status: "FILLED"
                };
                setOrders(prev => [newOrder, ...prev]);
                return { success: true };
            };

            return (
                <AppDataContext.Provider value={{
                    namedWatchlists,

                    activeWatchlistName,
                    setActiveWatchlistName,

                    positions,
                    orders,
                    alerts,

        // === SIMPLE HASH-BASED ROUTER HOOK ===
        function useRouter() {
            const [hash, setHash] = useState(window.location.hash || "#/");

            useEffect(() => {
                const handleHashChange = () => setHash(window.location.hash || "#/");
                window.addEventListener("hashchange", handleHashChange);
                return () => window.removeEventListener("hashchange", handleHashChange);
            }, []);

            const navigate = (to) => {
                window.location.hash = to;
            };

            const parseRoute = useMemo(() => {
                const cleaned = hash.replace(/^#/, "");
                const parts = cleaned.split("/");
                
                let route = "/";
                let params = {};
                
                if (parts[1] === "quote" && parts[2]) {
                    route = "/quote";
                    params.symbol = parts[2];
                } else if (parts[1] === "trade" && parts[2]) {
                    route = "/trade";
                    params.symbol = parts[2];
                } else if (parts[1] === "screener") {
                    route = "/screener";
                } else if (parts[1] === "heatmap") {
                    route = "/heatmap";
                } else if (parts[1] === "lists") {
                    route = "/lists";
                } else if (parts[1] === "portfolio") {
                    route = "/portfolio";
                } else if (parts[1] === "watchlist") {
                    route = "/watchlist";
                } else if (parts[1] === "news") {
                    route = "/news";
                } else if (parts[1] === "crypto") {
                    route = "/crypto";
                } else if (parts[1] === "forex") {
                    route = "/forex";
                } else if (parts[1] === "futures") {
                    route = "/futures";
                } else if (parts[1] === "earnings-calendar") {
                    route = "/earnings-calendar";
                } else if (parts[1] === "economic-calendar") {
                    route = "/economic-calendar";
                } else if (parts[1] === "dividends") {
                    route = "/dividends";
                } else if (parts[1] === "ipos") {
                    route = "/ipos";
                } else if (parts[1] === "insider-trading") {
                    route = "/insider-trading";
                } else if (parts[1] === "compare") {
                    route = "/compare";
                } else if (parts[1] === "alerts") {
                    route = "/alerts";
                } else if (parts[1] === "settings") {
                    route = "/settings";
                }
                
                return { route, params };
            }, [hash]);

            return { ...parseRoute, navigate };
        }

        // === VIEW 3: Heatmap View ===
        function HeatmapView({ navigate }) {
            const { liveOffsets } = useContext(AppDataContext);
            const [basis, setBasis] = useState("S&P 500");

            const allQuotes = useMemo(() => {
                return STOCKS_METADATA.map(m => {
                    const offset = liveOffsets[m.symbol] || 0;
                    return generateQuote(m, offset);
                });
            }, [liveOffsets]);

            const heatmapRects = useMemo(() => {
                const width = 1200;
                const height = 550;
                
                const SECTOR_COORDS = [
                    { name: "Technology", x: 0, y: 0, w: 0.45, h: 0.6 },
                    { name: "Financials", x: 0.45, y: 0, w: 0.25, h: 0.6 },
                    { name: "Healthcare", x: 0.7, y: 0, w: 0.3, h: 0.6 },
                    
                    { name: "Consumer Cyclical", x: 0, y: 0.6, w: 0.35, h: 0.4 },
                    { name: "Communication Services", x: 0.35, y: 0.6, w: 0.25, h: 0.4 },
                    { name: "Industrials", x: 0.6, y: 0.6, w: 0.15, h: 0.4 },
                    { name: "Energy", x: 0.75, y: 0.6, w: 0.1, h: 0.4 },
                    { name: "Utilities", x: 0.85, y: 0.6, w: 0.08, h: 0.4 },
                    { name: "Real Estate", x: 0.93, y: 0.6, w: 0.07, h: 0.4 }
                ];

                const rects = [];
                SECTOR_COORDS.forEach(sec => {
                    const secStocks = allQuotes.filter(q => q.sector === sec.name);
                    const sectorX = sec.x * width;
                    const sectorY = sec.y * height;
                    const sectorW = sec.w * width;
                    const sectorH = sec.h * height;
                    const subRects = divideRect(sectorX + 2, sectorY + 2, sectorW - 4, sectorH - 4, secStocks);
                    rects.push(...subRects);
                });
                return rects;
            }, [allQuotes]);

            return (
                <div class="flex-grow flex flex-col gap-3 min-h-0 select-none p-1">
                    <div class="flex justify-between items-center bg-white dark:bg-brand-bgPanelDark border border-brand-borderLight dark:border-brand-borderDark p-3 rounded-lg shrink-0">
                        <span class="font-bold">Basis: {basis}</span>
                        <div class="flex gap-1.5 bg-brand-bgPanelAltLight dark:bg-brand-bgPanelAltDark p-0.5 border border-brand-borderLight dark:border-brand-borderDark rounded text-xs font-bold">
                            {["S&P 500", "Full Market", "ETFs"].map(b => (
                                <button key={b} onClick={() => setBasis(b)} class={`px-2 py-0.5 rounded ${basis === b ? "bg-brand-accentBlue text-white" : ""}`}>{b}</button>
                            ))}
                        </div>
                    </div>

                    <div class="flex-grow bg-white dark:bg-brand-bgPanelDark border border-brand-borderLight dark:border-brand-borderDark rounded-lg p-2 relative min-h-[360px]">
                        <svg class="w-full h-full" viewBox="0 0 1200 550">
                            {heatmapRects.map(r => {
                                const isUp = r.changePct >= 0;
                                const absPct = Math.min(Math.abs(r.changePct), 4);
                                const alpha = 0.15 + (absPct / 4) * 0.75;
                                const fill = isUp ? `rgba(0, 200, 5, ${alpha})` : `rgba(255, 59, 48, ${alpha})`;
                                return (
                                    <g key={r.symbol} onClick={() => navigate(`/quote/${r.symbol}`)} class="cursor-pointer">
                                        <rect x={r.x} y={r.y} width={r.w} height={r.h} fill={fill} stroke="#131722" stroke-width="1.5" />
                                        {r.w > 40 && r.h > 30 && (
                                            <g>
                                                <text x={r.x + r.w / 2} y={r.y + r.h / 2 - 2} fill="#FFFFFF" font-size="11" font-weight="900" text-anchor="middle">{r.symbol}</text>
                                                <text x={r.x + r.w / 2} y={r.y + r.h / 2 + 10} fill="#FFFFFF" font-size="9" font-weight="bold" text-anchor="middle" class="tabular-nums">{isUp ? "+" : ""}{r.changePct.toFixed(1)}%</text>
                                            </g>
                                        )}
                                    </g>
                                );
                            })}
                        </svg>
                    </div>
                </div>
            );
        }

        // === VIEW 11: Forex View ===
        function ForexView() {
            const [fromCur, setFromCur] = useState("EUR");
            const [toCur, setToCur] = useState("USD");
            const [amount, setAmount] = useState(1);

            const conversionRate = useMemo(() => {
                if (fromCur === toCur) return 1;
                const pair = `${fromCur}/${toCur}`;
                const match = FOREX_METADATA.find(f => f.symbol === pair);
                if (match) return match.rate;
                
                const inversePair = `${toCur}/${fromCur}`;
                const invMatch = FOREX_METADATA.find(f => f.symbol === inversePair);
                if (invMatch) return 1 / invMatch.rate;
                
                return 1.15; // default fallback rate
            }, [fromCur, toCur]);

            return (
                <div class="flex-grow flex flex-col gap-3 min-h-0 overflow-y-auto custom-scroll p-1 text-xs select-none">
                    <div class="grid grid-cols-2 md:grid-cols-6 gap-3 shrink-0 font-bold">

                                <span class="text-brand-accentBlue font-bold">{f.symbol}</span>
                                <span class="tabular-nums font-black text-xs">{f.rate.toFixed(4)}</span>

            const [searchQuery, setSearchQuery] = useState("");
            const [activeDropdown, setActiveDropdown] = useState(null); // 'markets' | 'calendars' | 'research' | null
            const [lightMode, setLightMode] = useState(false);
            const searchRef = useRef(null);
            
            // Command Palette modal trigger state
            const [cmdPaletteOpen, setCmdPaletteOpen] = useState(false);
            const [cmdQuery, setCmdQuery] = useState("");

            useEffect(() => {
                const rootEl = document.documentElement;
                if (lightMode) rootEl.classList.remove('dark');
                else rootEl.classList.add('dark');
            }, [lightMode]);

            // Keyboard shortcut hooks (Cmd+K / Ctrl+K palette, Escape modals)
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
                        e.preventDefault();
                        setCmdPaletteOpen(prev => !prev);
                    }
                    if (e.key === "Escape") {
                        setCmdPaletteOpen(false);
                    }
                    if (e.key === "/" && document.activeElement !== searchRef.current) {
                        e.preventDefault();
                        if (searchRef.current) {
                            searchRef.current.focus();
                            searchRef.current.select();
                        }
                    }
                };
                window.addEventListener("keydown", handleKeyDown);
                return () => window.removeEventListener("keydown", handleKeyDown);
            }, []);

            const dropdownMatches = useMemo(() => {
                if (!searchQuery) return [];
                return STOCKS_METADATA.filter(m => m.symbol.toLowerCase().startsWith(searchQuery.toLowerCase()));
            }, [searchQuery]);

            const commandMatches = useMemo(() => {
                const routesList = [
                    { name: "home", path: "/" },
                    { name: "screener", path: "/screener" },
                    { name: "heatmap", path: "/heatmap" },
                    { name: "lists", path: "/lists" },
                    { name: "watchlist", path: "/watchlist" },
                    { name: "portfolio", path: "/portfolio" },
                    { name: "news", path: "/news" },
                    { name: "crypto", path: "/crypto" },
                    { name: "forex", path: "/forex" },
                    { name: "futures", path: "/futures" },
                    { name: "earnings calendar", path: "/earnings-calendar" },
                    { name: "economic calendar", path: "/economic-calendar" },
                    { name: "dividends", path: "/dividends" },
                    { name: "ipos", path: "/ipos" },
                    { name: "insider trading", path: "/insider-trading" },
                    { name: "compare tool", path: "/compare" },
                    { name: "alerts center", path: "/alerts" },
                    { name: "settings", path: "/settings" }
                ];
                if (!cmdQuery) return routesList;
                return routesList.filter(r => r.name.toLowerCase().includes(cmdQuery.toLowerCase()));
            }, [cmdQuery]);

            return (
                <div class="h-screen w-screen flex flex-col justify-between overflow-hidden bg-brand-bgAppLight dark:bg-brand-bgAppDark text-brand-textPrimaryLight dark:text-brand-textPrimaryDark transition-colors duration-120 font-sans text-xs">
                    
                    {/* Top nav bar, fixed height 64px, full width */}
                    <header class="h-16 border-b border-brand-borderLight dark:border-brand-borderDark bg-white dark:bg-brand-bgPanelDark flex items-center justify-between px-6 z-40 select-none shrink-0 shadow-md">
                        <div class="flex items-center gap-6">
                            <span onClick={() => navigate("/")} class="font-black text-lg tracking-wider text-brand-accentBlue cursor-pointer flex items-center gap-1.5 uppercase select-none">
                                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                                    <path d="M12 2L2 22h20L12 2zm1 14h-2v-2h2v2zm0-4h-2V8h2v4z"/>
                                </svg>
                                ApexTerminal
                            </span>
                            
                            {/* Grouped dropdown selectors */}
                            <nav class="hidden md:flex items-center gap-4 text-[11px] font-bold tracking-widest uppercase text-brand-textSecondaryLight dark:text-brand-textSecondaryDark relative">
                                <span onClick={() => navigate("/")} class={`cursor-pointer transition-colors ${route === "/" ? "text-brand-accentBlue font-black border-b-2 border-brand-accentBlue pb-1" : "hover:text-white"}`}>Home</span>
                                
                                <div class="relative">
                                    <span onClick={() => setActiveDropdown(activeDropdown === "markets" ? null : "markets")} class="cursor-pointer hover:text-white flex items-center gap-1 select-none">Markets ▾</span>
                                    {activeDropdown === "markets" && (
                                        <div class="absolute top-6 left-0 bg-white dark:bg-brand-bgPanelDark border border-brand-borderLight dark:border-brand-borderDark rounded shadow-2xl p-2 flex flex-col gap-1.5 w-44 z-50">
                                            <span onClick={() => { navigate("/screener"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">Screener</span>
                                            <span onClick={() => { navigate("/heatmap"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">Heatmap</span>
                                            <span onClick={() => { navigate("/lists"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">Lists</span>
                                            <span onClick={() => { navigate("/crypto"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">Crypto</span>
                                            <span onClick={() => { navigate("/forex"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">Forex</span>
                                            <span onClick={() => { navigate("/futures"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">Futures</span>
                                        </div>
                                    )}
                                </div>

                                <div class="relative">
                                    <span onClick={() => setActiveDropdown(activeDropdown === "calendars" ? null : "calendars")} class="cursor-pointer hover:text-white flex items-center gap-1 select-none">Calendars ▾</span>
                                    {activeDropdown === "calendars" && (
                                        <div class="absolute top-6 left-0 bg-white dark:bg-brand-bgPanelDark border border-brand-borderLight dark:border-brand-borderDark rounded shadow-2xl p-2 flex flex-col gap-1.5 w-44 z-50">
                                            <span onClick={() => { navigate("/earnings-calendar"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">Earnings Calendar</span>
                                            <span onClick={() => { navigate("/economic-calendar"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">Economic Calendar</span>
                                            <span onClick={() => { navigate("/dividends"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">Dividend Calendar</span>
                                            <span onClick={() => { navigate("/ipos"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">IPO Calendar</span>
                                        </div>
                                    )}
                                </div>

                                <div class="relative">
                                    <span onClick={() => setActiveDropdown(activeDropdown === "research" ? null : "research")} class="cursor-pointer hover:text-white flex items-center gap-1 select-none">Research ▾</span>
                                    {activeDropdown === "research" && (
                                        <div class="absolute top-6 left-0 bg-white dark:bg-brand-bgPanelDark border border-brand-borderLight dark:border-brand-borderDark rounded shadow-2xl p-2 flex flex-col gap-1.5 w-44 z-50">
                                            <span onClick={() => { navigate("/compare"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">Compare Tool</span>
                                            <span onClick={() => { navigate("/insider-trading"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">Insider Trading</span>
                                            <span onClick={() => { navigate("/news"); setActiveDropdown(null); }} class="cursor-pointer py-1 px-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded">News</span>
                                        </div>
                                    )}
                                </div>

                                <span onClick={() => navigate("/portfolio")} class={`cursor-pointer transition-colors ${route === "/portfolio" ? "text-brand-accentBlue font-black border-b-2 border-brand-accentBlue pb-1" : "hover:text-white"}`}>Portfolio</span>
                                <span onClick={() => navigate("/watchlist")} class={`cursor-pointer transition-colors ${route === "/watchlist" ? "text-brand-accentBlue font-black border-b-2 border-brand-accentBlue pb-1" : "hover:text-white"}`}>Watchlist</span>
                            </nav>
                        </div>

                        {/* Search input (centered) */}
                        <div class="relative w-[380px] hidden md:block">
                            <div class="flex items-center bg-brand-bgPanelAltLight dark:bg-brand-bgPanelAltDark border border-brand-borderLight dark:border-brand-borderDark px-3 py-2 rounded-md text-xs">
                                <svg class="w-4 h-4 text-brand-textSecondaryLight dark:text-brand-textSecondaryDark shrink-0 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                </svg>
                                <input 
                                    ref={searchRef}
                                    type="text" 
                                    placeholder="Search ticker or company..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    onKeyDown={(e) => {
                                        if (e.key === "Enter" && dropdownMatches.length > 0) {
                                            navigate(`/quote/${dropdownMatches[0].symbol}`);
                                            setSearchQuery("");
                                        }
                                    }}
                                    class="bg-transparent outline-none w-full text-brand-textPrimaryLight dark:text-brand-textPrimaryDark placeholder-gray-400 font-bold"
                                />
                                <span class="text-[9px] font-bold bg-gray-300 dark:bg-white/15 px-1.5 py-0.5 rounded text-gray-400 uppercase select-none cursor-default font-black">/</span>
                            </div>
                            {searchQuery && (
                                <div class="absolute w-full mt-1 bg-white dark:bg-brand-bgPanelDark border border-brand-borderLight dark:border-brand-borderDark rounded-md shadow-2xl z-50 overflow-hidden text-xs max-h-48 overflow-y-auto font-bold">
                                    {dropdownMatches.map(m => (
                                        <div 
                                            key={m.symbol}
                                            onClick={() => {
                                                navigate(`/quote/${m.symbol}`);
                                                setSearchQuery("");
                                            }}
                                            class="px-4 py-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark cursor-pointer flex justify-between items-center border-b border-brand-borderLight dark:border-brand-borderDark last:border-0"
                                        >
                                            <span class="text-brand-accentBlue">{m.symbol}</span>
                                            <span class="text-brand-textSecondaryLight dark:text-brand-textSecondaryDark text-[10px]">{m.name}</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Right Pill indicators & gear settings */}
                        <div class="flex items-center gap-4">
                            <div class="bg-brand-bgPanelAltLight dark:bg-brand-bgPanelAltDark border border-brand-borderLight dark:border-brand-borderDark px-3 py-1.5 rounded-full text-xs font-bold tabular-nums text-brand-green">
                                ${cash.toFixed(2)}
                            </div>
                            <button 
                                aria-label="Toggle visual theme"
                                onClick={() => setLightMode(prev => !prev)}
                                class="p-1.5 border border-brand-borderLight dark:border-brand-borderDark hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded-md transition-colors text-brand-textSecondaryLight dark:text-brand-textSecondaryDark"
                            >
                                {lightMode ? (
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                                        <path d="M12 3a9 9 0 109 9 9.08 9.08 0 00-9-9zm0 16a7 7 0 117-7 7.02 7.02 0 01-7 7z"/>
                                    </svg>
                                ) : (
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                                        <path d="M12 7a5 5 0 105 5 5 5 0 00-5-5zm0 8a3 3 0 113-3 3 3 0 01-3 3zm0-13a1 1 0 00-1 1v1a1 1 0 002 0V3a1 1 0 00-1-1zm0 17a1 1 0 00-1 1v1a1 1 0 002 0v-1a1 1 0 00-1-1zm8.66-13.66a1 1 0 00-1.41 0l-.7.7a1 1 0 001.41 1.41l.7-.7a1 1 0 000-1.41zm-15.55 15.55a1 1 0 00-1.41 0l-.7.7a1 1 0 101.41 1.41l.7-.7a1 1 0 000-1.41zM21 11h-1a1 1 0 000 2h1a1 1 0 000-2zM4 11H3a1 1 0 000 2h1a1 1 0 000-2zm14.66 4.66a1 1 0 00-1.41 0l-.7.7a1 1 0 001.41 1.41l.7-.7a1 1 0 000-1.41zM7.11 5.7a1 1 0 00-1.41 0l-.7.7a1 1 0 001.41 1.41l.7-.7a1 1 0 000-1.41z"/>
                                    </svg>
                                )}
                            </button>
                            <button onClick={() => navigate("/alerts")} class="p-1.5 border border-brand-borderLight dark:border-brand-borderDark hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded-md text-brand-textSecondaryLight dark:text-brand-textSecondaryDark relative">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                                    <path d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6V11c0-3.07-1.63-5.64-4.5-6.32V4a1.5 1.5 0 00-3 0v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                                </svg>
                                {alerts.length > 0 && (
                                    <div class="absolute -top-1.5 -right-1.5 w-3.5 h-3.5 bg-brand-red rounded-full flex items-center justify-center text-[8px] text-white font-black">{alerts.length}</div>
                                )}
                            </button>
                            <button onClick={() => navigate("/settings")} class="p-1.5 border border-brand-borderLight dark:border-brand-borderDark hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark rounded-md text-brand-textSecondaryLight dark:text-brand-textSecondaryDark">
                                <svg class="w-4 h-4 fill-none stroke-current" stroke-width="2.5" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </header>

                    {/* Index strip cards */}
                    <div class="h-10 border-b border-brand-borderLight dark:border-brand-borderDark bg-white dark:bg-brand-bgPanelDark flex items-center justify-between px-6 shrink-0 overflow-x-auto custom-scroll gap-4">
                        {[
                            { name: "S&P 500", price: 5184.22, change: 1.12, spark: [5120, 5135, 5130, 5150, 5184] },
                            { name: "Dow 30", price: 38920.40, change: 0.35, spark: [38700, 38800, 38780, 38890, 38920] },
                            { name: "Nasdaq", price: 16120.15, change: 1.45, spark: [15900, 15980, 15950, 16050, 16120] },
                            { name: "Russell 2000", price: 2043.10, change: -0.42, spark: [2060, 2055, 2058, 2046, 2043] },
                            { name: "VIX", price: 13.85, change: -3.12, spark: [14.5, 14.2, 14.1, 13.9, 13.85] },
                            { name: "10-Yr Yield", price: 4.225, change: -0.85, spark: [4.28, 4.26, 4.25, 4.23, 4.225] }
                        ].map((idx) => {
                            const isUp = idx.change >= 0;
                            const sparkMin = Math.min(...idx.spark);
                            const sparkMax = Math.max(...idx.spark);
                            const svgPoints = idx.spark.map((p, i) => `${(i / 4) * 40},${15 - ((p - sparkMin) / (sparkMax - sparkMin || 1)) * 15}`).join(" ");

                            return (
                                <div key={idx.name} class="flex items-center justify-between gap-4 w-[160px] shrink-0 text-[10px] select-none font-bold">
                                    <div class="flex flex-col">
                                        <span class="font-extrabold text-brand-textSecondaryLight dark:text-brand-textSecondaryDark">{idx.name}</span>
                                        <span class="font-black tabular-nums text-brand-textPrimaryLight dark:text-brand-textPrimaryDark">${idx.price.toLocaleString(undefined, {minimumFractionDigits:2})}</span>
                                    </div>
                                    <svg class="w-10 h-4 overflow-visible" viewBox="0 0 40 15">
                                        <polyline fill="none" stroke={isUp ? "#00C805" : "#FF3B30"} stroke-width="1.5" points={svgPoints} />
                                    </svg>
                                    <div class="text-right flex flex-col font-bold">
                                        <span class={isUp ? "text-brand-green" : "text-brand-red"}>
                                            {isUp ? "+" : ""}{idx.change}%
                                        </span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Router main container */}
                    <div class="flex-grow max-w-[1600px] w-full mx-auto p-3 min-h-0 flex flex-col overflow-hidden">
                        {route === "/" && <HomeView navigate={navigate} />}
                        {route === "/screener" && <ScreenerView navigate={navigate} />}
                        {route === "/heatmap" && <HeatmapView navigate={navigate} />}
                        {route === "/lists" && (
                            <div class="flex-grow flex flex-col gap-3 p-4 min-h-0 overflow-hidden select-none text-xs">
                                <div class="bg-white dark:bg-brand-bgPanelDark border border-brand-borderLight dark:border-brand-borderDark p-4 rounded-lg flex flex-col min-h-0">
                                    <h3 class="text-xs uppercase border-b border-brand-borderLight dark:border-brand-borderDark pb-2 mb-2 font-bold text-brand-textSecondaryLight dark:text-brand-textSecondaryDark">Pre-Filtered Stocks lists</h3>
                                    <div class="flex-grow overflow-y-auto custom-scroll">
                                        <table class="w-full text-left text-xs font-bold">
                                            <thead>
                                                <tr class="text-[10px] text-brand-textSecondaryLight dark:text-brand-textSecondaryDark uppercase border-b border-brand-borderLight dark:border-brand-borderDark">
                                                    <th class="py-2">#</th>
                                                    <th class="py-2">Ticker</th>
                                                    <th class="py-2">Company</th>
                                                    <th class="py-2">Sector</th>
                                                    <th class="py-2 text-right">Price</th>
                                                    <th class="py-2 text-right">Change %</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {allQuotes.slice(0, 10).map((q, idx) => (
                                                    <tr key={q.symbol} onClick={() => navigate(`/quote/${q.symbol}`)} class="border-b border-brand-borderLight dark:border-brand-borderDark last:border-0 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark cursor-pointer font-bold">
                                                        <td class="py-2 text-gray-400">{idx + 1}</td>
                                                        <td class="py-2 text-brand-accentBlue">{q.symbol}</td>
                                                        <td class="py-2 text-brand-textSecondaryLight dark:text-brand-textSecondaryDark font-medium truncate max-w-[150px]">{q.name}</td>
                                                        <td class="py-2 text-brand-textSecondaryLight dark:text-brand-textSecondaryDark">{q.sector}</td>
                                                        <td class="py-2 text-right tabular-nums">${q.price.toFixed(2)}</td>
                                                        <td class={`py-2 text-right tabular-nums ${q.changePct >= 0 ? "text-brand-green" : "text-brand-red"}`}>
                                                            {q.changePct >= 0 ? "+" : ""}{q.changePct.toFixed(2)}%
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                        {route === "/quote" && <QuoteView symbol={params.symbol} navigate={navigate} />}
                        {route === "/trade" && <TradeView symbol={params.symbol} navigate={navigate} />}
                        {route === "/portfolio" && <PortfolioView navigate={navigate} />}
                        {route === "/watchlist" && <WatchlistView navigate={navigate} />}
                        {route === "/news" && <NewsView navigate={navigate} />}
                        
                        {/* New Routes */}
                        {route === "/crypto" && <CryptoView navigate={navigate} />}
                        {route === "/forex" && <ForexView />}
                        {route === "/futures" && <FuturesView />}
                        {route === "/earnings-calendar" && <EarningsCalendarView navigate={navigate} />}
                        {route === "/economic-calendar" && <EconomicCalendarView />}
                        {route === "/dividends" && <DividendCalendarView />}
                        {route === "/ipos" && <IPOCalendarView />}
                        {route === "/insider-trading" && <InsiderTradingView />}
                        {route === "/compare" && <CompareToolView />}
                        {route === "/alerts" && <AlertsView />}
                        {route === "/settings" && <SettingsView />}
                    </div>

                    {/* Keyboard Cmd+K Palette Center overlay Modal */}
                    {cmdPaletteOpen && (
                        <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 animate-fade-in select-none">
                            <div class="bg-white dark:bg-brand-bgPanelDark border-2 border-brand-accentBlue w-full max-w-md rounded-lg shadow-2xl p-4 flex flex-col gap-3 font-bold select-none text-xs">
                                <div class="flex justify-between items-center border-b border-brand-borderLight dark:border-brand-borderDark pb-2 shrink-0">
                                    <span class="text-xs uppercase tracking-widest text-brand-textSecondaryLight dark:text-brand-textSecondaryDark font-bold">Command Navigation Palette</span>
                                    <button onClick={() => setCmdPaletteOpen(false)} class="text-brand-red font-bold text-xs">✕</button>
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="Type route name to jump..."
                                    value={cmdQuery}
                                    onChange={(e) => setCmdQuery(e.target.value)}
                                    class="bg-brand-bgPanelAltLight dark:bg-brand-bgPanelAltDark border border-brand-borderLight dark:border-brand-borderDark p-2 rounded outline-none text-xs font-bold"
                                    autoFocus
                                />
                                <div class="flex-grow overflow-y-auto max-h-48 custom-scroll flex flex-col gap-1 shrink-0 font-bold select-none text-xs">
                                    {commandMatches.map(c => (
                                        <div 
                                            key={c.name} 
                                            onClick={() => { navigate(c.path); setCmdPaletteOpen(false); setCmdQuery(""); }}
                                            class="p-2 hover:bg-brand-bgHoverLight dark:hover:bg-brand-bgHoverDark cursor-pointer rounded flex justify-between font-bold"
                                        >
                                            <span class="capitalize">{c.name}</span>
                                            <span class="text-brand-accentBlue font-bold">{c.path}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        function App() {
            return (
                <AppDataProvider>
                    <ApplicationComposer />
                </AppDataProvider>
            );
        }

        const container = document.getElementById("react-root");
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
